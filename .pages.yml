# Pages CMS configuration (https://pagescms.org/docs/configuration/)
# Edit the site at https://app.pagescms.org

media:
  - name: images
    label: Images
    input: images
    output: /images
    rename: safe

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, categories]
      sort: [title]
      search: [title, excerpt]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: author
        label: Author
        type: string
        default: iHomeAutomate
      - name: excerpt
        label: Excerpt
        type: text
        description: Short summary shown on the front page and in listings.
      - name: categories
        label: Categories
        type: select
        options:
          multiple: true
          values:
            - homeseer
            - news
            - z-wave
            - vera
            - infrared
            - homeseer3
            - home-entertainment
            - fibaro
            - EventGhost
            - rfxcom
            - ip-camera
            - android
      - name: tags
        label: Tags
        type: string
        list: true
      - name: permalink
        label: Permalink
        type: string
        description: Optional. Leave empty to use the site default (/category/title/).
      - name: header
        label: Header images
        type: object
        fields:
          - name: teaser
            label: Teaser (400x250)
            type: image
            options:
              media: images
          - name: feature
            label: Feature image
            type: image
            options:
              media: images
      - name: comments
        label: Comments
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          media: images

  - name: projects
    label: Projects
    type: collection
    path: _posts/projects
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      fields: [title]
      search: [title, excerpt]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: author
        label: Author
        type: string
        default: iHomeAutomate
      - name: excerpt
        label: Excerpt
        type: text
      - name: project
        label: Project
        type: boolean
        default: true
        hidden: true
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          media: images
