remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"

# Site settings
title: iHomeAutomate
subtitle: "Home Automation Tips & Tutorials"
description: "Tips and information about home automation - Tutorials, experiences, applications that make home automation easier"
url: https://www.ihomeautomate.com
baseurl: ""
logo: "/images/home-150x1501.png"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-include-cache
  - jekyll-remote-theme

# Author
author:
  name: "iHomeAutomate"
  avatar: "/images/bio-photo.jpg"
  bio: "Tips and information about home automation"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.ihomeautomate.com"

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: false
      share: false
      related: true
      header:
        teaser: /images/home-400x250.png
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

# Pagination
paginate: 12
paginate_path: /page:num/

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-8ZLY9LHWRT"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - LICENSE
  - README.md
  - docker-compose.yml

# Hide the theme's default /feed.xml links (footer + head)
atom_feed:
  hide: true
